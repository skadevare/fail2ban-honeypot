[php-honeypot]
enabled  = true
filter   = php-honeypot
logpath  = /var/log/php-honeypot/ban.log
# Read the file directly. Some distros (e.g. Debian 12) default to the
# systemd journal backend, which would never see this log.
backend  = auto

# One hit = banned for 24 hours.
maxretry = 1
findtime = 3600
bantime  = 86400

# Never ban yourself. Add your own public IP(s) here.
ignoreip = 127.0.0.1/8 ::1

# --- How the ban is enforced --------------------------------------------
# Behind Cloudflare, all traffic reaches this server from Cloudflare's IPs,
# so a local firewall rule for the client IP blocks nothing. The ban has to
# be placed at Cloudflare. Create an API token with permission
# "Zone > Firewall Services > Edit" and fill in the zone ID + token:
action = cloudflare-token[cfzone="YOUR_ZONE_ID", cftoken="YOUR_API_TOKEN"]

# If the server is ever exposed directly (no proxy), use a local firewall
# ban instead (comment out the line above, uncomment this one):
# action = %(action_)s
